name: Desktop cross-platform packages
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-packages.yml'
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install --no-package-lock
      - name: Build frontend
        working-directory: desktop
        run: npm run build
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Bundle native Python engine
        working-directory: desktop
        run: python scripts/build-engine.py
      - name: Generate icons
        working-directory: desktop
        run: npm run icons
      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test
      - name: Build platform installer
        working-directory: desktop
        run: npm run tauri build
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
