name: Desktop Validation
on:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-validation.yml'
  push:
    branches:
      - feature/multi-agent-providers
      - feature/v0.3.0-hardening
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install --no-package-lock
      - name: TypeScript and Vite build
        working-directory: desktop
        run: npm run build
      - name: Install engine bundler
        run: python3 -m pip install --user pyinstaller
      - name: Build real engine sidecar
        working-directory: desktop
        run: npm run bundle:engine
      - name: Generate Tauri icons from source SVG
        working-directory: desktop
        run: npm run icons
      - name: Rust unit tests
        working-directory: desktop/src-tauri
        run: cargo test
