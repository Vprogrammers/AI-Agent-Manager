name: Interactive CLI checks

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/interactive-cli.yml"
  push:
    branches:
      - "feature/17-prompt-attachments"
    paths:
      - "desktop/**"
      - ".github/workflows/interactive-cli.yml"
  workflow_dispatch:

jobs:
  desktop:
    name: React build and Rust tests
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Install JavaScript dependencies and update lockfile
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: TypeScript and Vite build
        working-directory: desktop
        run: npm run build
      - name: Build the real AAM engine sidecar for Tauri
        run: |
          python3 -m pip install --user pyinstaller
          python3 desktop/scripts/build-engine.py
          test -x "desktop/src-tauri/binaries/aam-engine-$(rustc -vV | sed -n 's/^host: //p')"
      - name: Rust unit tests
        working-directory: desktop/src-tauri
        run: cargo test
      - name: Rust check
        working-directory: desktop/src-tauri
        run: cargo check
