[package]
name = "aam-desktop"
version = "0.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tauri-plugin-dialog = "2"

tokio = { version = "1", features = ["process", "time", "io-util", "macros"] }

portable-pty = "0.8"
